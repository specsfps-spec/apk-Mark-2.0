
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verificar projeto
        run: |
          ls -la
          ls -la android-app
          find android-app -name gradlew -o -name build.gradle -o -name build.gradle.kts

      - name: Compilar APK
        working-directory: android-app
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f build.gradle ]; then
            gradle assembleDebug
          else
            echo "Nao encontrei o arquivo de compilacao Gradle esperado."
            exit 1
          fi

      - name: Disponibilizar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MarkLV-Android-APK
          path: android-app/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
